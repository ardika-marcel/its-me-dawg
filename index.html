<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basecamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f8ff; --bg2:#eaf1ff; --card:#ffffff; --card2:#eef4ff;
  --border:#d7e6fb; --text:#152341; --dim:#5c6f92;
  --blue:#2f6fed; --blue2:#5b93ff; --cyan:#0fb4c9; --gold:#e0a02e; --green:#1fae7a;
  --radius:16px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:linear-gradient(180deg,#e8f0ff 0%,#f7faff 40%,#ffffff 100%);
  color:var(--text); font-family:'Inter',sans-serif; min-height:100%;
}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.brand{font-size:22px;font-weight:700;letter-spacing:-.02em;}
.brand span{color:var(--blue2);}
.date{font-size:12px;color:var(--dim);margin-top:2px;}
.badgechip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);
  padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;}
.badgechip:hover{border-color:var(--blue);}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;margin-bottom:18px;overflow-x:auto;}
nav button{flex:1;white-space:nowrap;background:transparent;border:none;color:var(--dim);font-family:inherit;
  font-weight:600;font-size:13.5px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:.15s;}
nav button.active{background:linear-gradient(135deg,var(--blue),#3868c9);color:#fff;}
.panel{display:none;}
.panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;
  box-shadow:0 4px 18px rgba(47,111,237,.06);}
.card h2{margin:0 0 4px;font-size:17px;}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 14px;}
.row{display:flex;gap:8px;}
input[type=text],input[type=time],input[type=number]{
  background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;
  padding:10px 12px;font-size:14px;font-family:inherit;width:100%;
}
input:focus{outline:2px solid var(--blue);outline-offset:1px;}
button.primary{background:linear-gradient(135deg,var(--blue),#3868c9);color:#fff;border:none;
  border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;}
button.primary:hover{filter:brightness(1.08);}
.ghost{background:transparent;border:1px solid var(--border);color:var(--dim);border-radius:8px;
  padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
.ghost:hover{color:var(--text);border-color:var(--blue);}
ul.list{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:8px;}
ul.list li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;font-size:14px;}
ul.list li .t{color:var(--dim);font-size:12px;min-width:44px;}
ul.list li .txt{flex:1;}
ul.list li.done .txt{text-decoration:line-through;color:var(--dim);}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:18px 0;}
.tabbtn{display:flex;gap:6px;margin-bottom:10px;}
.tabbtn button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);
  color:var(--dim);font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;}
.tabbtn button.sel{background:var(--blue);color:#fff;border-color:var(--blue);}
/* water */
.ringwrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;}
.ringnum{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--dim);margin-top:8px;}
.ringnum b{color:var(--text);font-size:26px;}
.quickrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;}
.quickrow button{background:var(--bg2);border:1px solid var(--border);color:var(--cyan);border-radius:10px;
  padding:10px 4px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.quickrow button:hover{border-color:var(--cyan);}
/* badges */
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;}
.badge{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--bg2);font-size:22px;gap:4px;text-align:center;padding:4px;}
.badge.unlocked{background:linear-gradient(160deg,#fff7e8,#fdeecb);border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,160,46,.2);}
.badge span.lbl{font-size:9.5px;color:var(--dim);font-weight:600;line-height:1.15;}
.badge.unlocked span.lbl{color:var(--gold);}
.badge.locked{opacity:.35;filter:grayscale(1);}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--gold);
  color:#241a05;padding:11px 18px;border-radius:10px;font-weight:700;font-size:13.5px;opacity:0;
  transition:.35s;pointer-events:none;z-index:50;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@media(prefers-reduced-motion:reduce){.panel.active{animation:none;}.toast{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">Base<span>camp</span></div>
      <div class="date" id="dateLabel"></div>
    </div>
    <button class="badgechip" onclick="showPanel('badges')">🏅 <span id="badgeCount">0</span>/16</button>
  </header>

  <nav>
    <button data-p="schedule" class="active" onclick="showPanel('schedule')">Schedule</button>
    <button data-p="water" onclick="showPanel('water')">Water</button>
    <button data-p="notes" onclick="showPanel('notes')">Notes</button>
    <button data-p="goals" onclick="showPanel('goals')">Goals</button>
  </nav>

  <section class="panel active" id="p-schedule">
    <div class="card">
      <h2>Schedule</h2>
      <p class="sub">Plan your day — or get ahead and plan tomorrow.</p>
      <div class="tabbtn">
        <button id="selToday" class="sel" onclick="setSchedDay(0)">Today</button>
        <button id="selTom" onclick="setSchedDay(1)">Tomorrow</button>
      </div>
      <div class="row">
        <input type="time" id="schedTime" style="max-width:110px">
        <input type="text" id="schedText" placeholder="What's happening?">
        <button class="primary" onclick="addSched()">Add</button>
      </div>
      <ul class="list" id="schedList"></ul>
    </div>
  </section>

  <section class="panel" id="p-water">
    <div class="card">
      <h2>Water</h2>
      <p class="sub">Daily goal: 2,500 ml</p>
      <div class="ringwrap">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r="68" fill="none" stroke="#dfe9fb" stroke-width="14"/>
          <circle id="waterRing" cx="80" cy="80" r="68" fill="none" stroke="url(#g)" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="427" stroke-dashoffset="427" transform="rotate(-90 80 80)"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0fb4c9"/><stop offset="100%" stop-color="#2f6fed"/>
          </linearGradient></defs>
        </svg>
        <div class="ringnum"><b id="waterTotal">0</b> / 2500 ml</div>
      </div>
      <div class="quickrow">
        <button onclick="addWater(150)">+150</button>
        <button onclick="addWater(250)">+250</button>
        <button onclick="addWater(500)">+500</button>
        <button onclick="customWater()">+ml</button>
      </div>
      <ul class="list" id="waterList" style="margin-top:16px"></ul>
    </div>
  </section>

  <section class="panel" id="p-notes">
    <div class="card">
      <h2>Notes</h2>
      <p class="sub">Quick things worth remembering.</p>
      <div class="row">
        <input type="text" id="noteText" placeholder="Note it down...">
        <button class="primary" onclick="addNote()">Add</button>
      </div>
      <ul class="list" id="noteList"></ul>
    </div>
  </section>

  <section class="panel" id="p-goals">
    <div class="card">
      <h2>Goals</h2>
      <p class="sub">What you're working toward.</p>
      <div class="row">
        <input type="text" id="goalText" placeholder="A goal worth chasing...">
        <button class="primary" onclick="addGoal()">Add</button>
      </div>
      <ul class="list" id="goalList"></ul>
    </div>
  </section>

  <section class="panel" id="p-badges">
    <div class="card">
      <h2>Badges</h2>
      <p class="sub">Earned by actually using the thing.</p>
      <div class="bgrid" id="badgeGrid"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const BADGES = [
 {id:'first_step',icon:'📝',name:'First Step',desc:'Log your first action'},
 {id:'planner',icon:'🗓️',name:'Planner',desc:'Add a schedule task'},
 {id:'early_bird',icon:'🌅',name:'Ahead of Time',desc:'Plan tomorrow'},
 {id:'busy_day',icon:'📋',name:'Busy Day',desc:'5+ tasks in one day'},
 {id:'hydrated',icon:'💧',name:'Hydrated',desc:'Hit 2,500ml goal'},
 {id:'overflow',icon:'🌊',name:'Overflow',desc:'3,000ml in a day'},
 {id:'streak3',icon:'🔥',name:'3-Day Streak',desc:'Goal met 3 days running'},
 {id:'streak7',icon:'⚡',name:'Week Strong',desc:'Goal met 7 days running'},
 {id:'note_taker',icon:'🗒️',name:'Note Taker',desc:'Write a note'},
 {id:'archivist',icon:'📚',name:'Archivist',desc:'10 notes written'},
 {id:'dreamer',icon:'🎯',name:'Dreamer',desc:'Set a goal'},
 {id:'achiever',icon:'🏆',name:'Achiever',desc:'Complete a goal'},
 {id:'high_achiever',icon:'🥇',name:'High Achiever',desc:'5 goals completed'},
 {id:'all_rounder',icon:'🧭',name:'All-Rounder',desc:'Visit every panel'},
 {id:'night_owl',icon:'🌙',name:'Night Owl',desc:'Active after 11pm'},
 {id:'regular',icon:'📆',name:'Regular',desc:'Used on 3 different days'},
];
let state = {schedule:{}, water:{}, notes:[], goals:[], unlocked:{}, visited:[], usedDates:[], seq:1};
let schedDayOffset = 0;

function todayStr(off=0){
  const d=new Date(); d.setDate(d.getDate()+off);
  return d.toISOString().slice(0,10);
}
const SUPABASE_URL = "https://mpbpksxvyailbsuebvzi.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_8YZtGZFVEPNJEOQevcFsZg_bg4u9_fI";
const SB_HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json"
};

async function save(){
  try{
    await fetch(SUPABASE_URL + "basecamp_state", {
      method: "POST",
      headers: Object.assign({}, SB_HEADERS, {"Prefer":"resolution=merge-duplicates"}),
      body: JSON.stringify([{ id: "default", data: state }])
    });
  }catch(e){ console.error(e); }
}
async function load(){
  try{
    const res = await fetch(SUPABASE_URL + "basecamp_state?id=eq.default&select=data", { headers: SB_HEADERS });
    const rows = await res.json();
    if(rows && rows[0] && rows[0].data) state = Object.assign(state, rows[0].data);
  }catch(e){ /* nothing saved yet */ }
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('show'),2600);
}
function unlock(id){
  if(state.unlocked[id]) return;
  state.unlocked[id]=Date.now();
  const b=BADGES.find(x=>x.id===id);
  toast(`${b.icon} Badge unlocked — ${b.name}`);
}
function markUsed(){
  const t=todayStr();
  if(!state.usedDates.includes(t)) state.usedDates.push(t);
  unlock('first_step');
  if(new Date().getHours()>=23) unlock('night_owl');
  if(state.usedDates.length>=3) unlock('regular');
}
function checkBadges(){
  // water streaks
  const dates=Object.keys(state.water).sort();
  let streak=0,maxStreak=0;
  let cursor=new Date();
  for(let i=0;i<30;i++){
    const ds=cursor.toISOString().slice(0,10);
    const total=(state.water[ds]||[]).reduce((a,b)=>a+b.ml,0);
    if(total>=2500){streak++; maxStreak=Math.max(maxStreak,streak);}
    else if(ds!==todayStr()) break;
    cursor.setDate(cursor.getDate()-1);
  }
  if(maxStreak>=3) unlock('streak3');
  if(maxStreak>=7) unlock('streak7');
  if(state.notes.length>=10) unlock('archivist');
  if(state.goals.filter(g=>g.done).length>=5) unlock('high_achiever');
  if(['schedule','water','notes','goals'].every(p=>state.visited.includes(p))) unlock('all_rounder');
  renderBadges();
  save();
}
function renderBadges(){
  document.getElementById('badgeCount').textContent = Object.keys(state.unlocked).length;
  const g=document.getElementById('badgeGrid'); g.innerHTML='';
  BADGES.forEach(b=>{
    const on = !!state.unlocked[b.id];
    const el=document.createElement('div');
    el.className='badge '+(on?'unlocked':'locked');
    el.title=b.desc;
    el.innerHTML=`${b.icon}<span class="lbl">${b.name}</span>`;
    g.appendChild(el);
  });
}

function showPanel(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('p-'+name).classList.add('active');
  const navBtn=document.querySelector(`nav button[data-p="${name}"]`);
  if(navBtn) navBtn.classList.add('active');
  if(!state.visited.includes(name)) state.visited.push(name);
  checkBadges();
}

// Schedule
function setSchedDay(off){
  schedDayOffset=off;
  document.getElementById('selToday').classList.toggle('sel',off===0);
  document.getElementById('selTom').classList.toggle('sel',off===1);
  renderSched();
}
function addSched(){
  const time=document.getElementById('schedTime').value||'--:--';
  const text=document.getElementById('schedText').value.trim();
  if(!text) return;
  const ds=todayStr(schedDayOffset);
  if(!state.schedule[ds]) state.schedule[ds]=[];
  state.schedule[ds].push({id:state.seq++, time, text, done:false});
  state.schedule[ds].sort((a,b)=>a.time.localeCompare(b.time));
  document.getElementById('schedText').value='';
  markUsed(); unlock('planner');
  if(schedDayOffset===1) unlock('early_bird');
  if(state.schedule[ds].length>=5) unlock('busy_day');
  renderSched(); checkBadges();
}
function toggleSched(ds,id){
  const item=state.schedule[ds].find(x=>x.id===id);
  if(item) item.done=!item.done;
  renderSched(); save();
}
function delSched(ds,id){
  state.schedule[ds]=state.schedule[ds].filter(x=>x.id!==id);
  renderSched(); save();
}
function renderSched(){
  const ds=todayStr(schedDayOffset);
  const items=state.schedule[ds]||[];
  const ul=document.getElementById('schedList'); ul.innerHTML='';
  if(!items.length){ ul.innerHTML='<div class="empty">Nothing planned yet.</div>'; return; }
  items.forEach(it=>{
    const li=document.createElement('li'); if(it.done) li.classList.add('done');
    li.innerHTML=`<span class="t">${it.time}</span><span class="txt">${escapeHtml(it.text)}</span>`;
    const chk=document.createElement('button'); chk.className='ghost'; chk.textContent=it.done?'Undo':'Done';
    chk.onclick=()=>toggleSched(ds,it.id);
    const del=document.createElement('button'); del.className='ghost'; del.textContent='✕';
    del.onclick=()=>delSched(ds,it.id);
    li.appendChild(chk); li.appendChild(del); ul.appendChild(li);
  });
}

// Water
function addWater(ml){
  const ds=todayStr();
  if(!state.water[ds]) state.water[ds]=[];
  state.water[ds].push({id:state.seq++, ml, time:new Date().toTimeString().slice(0,5)});
  markUsed();
  const total=state.water[ds].reduce((a,b)=>a+b.ml,0);
  if(total>=2500) unlock('hydrated');
  if(total>=3000) unlock('overflow');
  renderWater(); checkBadges();
}
function customWater(){
  const v=prompt('How many ml?');
  const n=parseInt(v,10);
  if(n>0) addWater(n);
}
function delWater(id){
  const ds=todayStr();
  state.water[ds]=state.water[ds].filter(x=>x.id!==id);
  renderWater(); save();
}
function renderWater(){
  const ds=todayStr();
  const log=state.water[ds]||[];
  const total=log.reduce((a,b)=>a+b.ml,0);
  document.getElementById('waterTotal').textContent=total;
  const pct=Math.min(1,total/2500);
  const circumference=2*Math.PI*68;
  document.getElementById('waterRing').style.strokeDashoffset = circumference*(1-pct);
  const ul=document.getElementById('waterList'); ul.innerHTML='';
  if(!log.length){ ul.innerHTML='<div class="empty">No water logged today.</div>'; return; }
  [...log].reverse().forEach(it=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="t">${it.time}</span><span class="txt">${it.ml} ml</span>`;
    const del=document.createElement('button'); del.className='ghost'; del.textContent='✕';
    del.onclick=()=>delWater(it.id);
    li.appendChild(del); ul.appendChild(li);
  });
}

// Notes
function addNote(){
  const text=document.getElementById('noteText').value.trim();
  if(!text) return;
  state.notes.unshift({id:state.seq++, text, ts:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short'})});
  document.getElementById('noteText').value='';
  markUsed(); unlock('note_taker');
  renderNotes(); checkBadges();
}
function delNote(id){ state.notes=state.notes.filter(n=>n.id!==id); renderNotes(); save(); }
function renderNotes(){
  const ul=document.getElementById('noteList'); ul.innerHTML='';
  if(!state.notes.length){ ul.innerHTML='<div class="empty">No notes yet.</div>'; return; }
  state.notes.forEach(n=>{
    const li=document.createElement('li');
    li.innerHTML=`<span class="t">${n.ts}</span><span class="txt">${escapeHtml(n.text)}</span>`;
    const del=document.createElement('button'); del.className='ghost'; del.textContent='✕';
    del.onclick=()=>delNote(n.id);
    li.appendChild(del); ul.appendChild(li);
  });
}

// Goals
function addGoal(){
  const text=document.getElementById('goalText').value.trim();
  if(!text) return;
  state.goals.unshift({id:state.seq++, text, done:false});
  document.getElementById('goalText').value='';
  markUsed(); unlock('dreamer');
  renderGoals(); checkBadges();
}
function toggleGoal(id){
  const g=state.goals.find(x=>x.id===id);
  if(g){ g.done=!g.done; if(g.done) unlock('achiever'); }
  renderGoals(); checkBadges();
}
function delGoal(id){ state.goals=state.goals.filter(g=>g.id!==id); renderGoals(); save(); }
function renderGoals(){
  const ul=document.getElementById('goalList'); ul.innerHTML='';
  if(!state.goals.length){ ul.innerHTML='<div class="empty">No goals yet.</div>'; return; }
  state.goals.forEach(g=>{
    const li=document.createElement('li'); if(g.done) li.classList.add('done');
    li.innerHTML=`<span class="txt">${escapeHtml(g.text)}</span>`;
    const chk=document.createElement('button'); chk.className='ghost'; chk.textContent=g.done?'Undo':'Done';
    chk.onclick=()=>toggleGoal(g.id);
    const del=document.createElement('button'); del.className='ghost'; del.textContent='✕';
    del.onclick=()=>delGoal(g.id);
    li.appendChild(chk); li.appendChild(del); ul.appendChild(li);
  });
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function init(){
  document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  await load();
  renderSched(); renderWater(); renderNotes(); renderGoals(); renderBadges();
}
init();
</script>
</body>
</html>
